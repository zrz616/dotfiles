# LazyGit Dracula 配置

# 使用 delta 作为分页器
git:
  paging:
    colorArg: always
    pager: delta

# Dracula 主题
gui:
  theme:
    activeBorderColor:
      - green
    inactiveBorderColor:
      - gray
    optionsBorderColor:
      - cyan
    
    # Dracula 配色
    selectedLineBgColor:
      - blue
    selectedRangeBgColor:
      - blue
    
    # Dracula 颜色值
    red: "#ff5555"
    green: "#50fa7b"
    yellow: "#f1fa8c"
    blue: "#6272a4"
    purple: "#bd93f9"
    cyan: "#8be9fd"
    white: "#f8f8f2"
    gray: "#6272a4"
    black: "#21222c"
    
    blackBright: "#44475a"
    redBright: "#ff6e6e"
    greenBright: "#69ff94"
    yellowBright: "#ffffa5"
    blueBright: "#6c6f93"
    purpleBright: "#d6acff"
    cyanBright: "#a4ffff"
    whiteBright: "#ffffff"

  window:
    borderStyle: rounded
