# ===========================================
# Dracula Theme for Starship
# ===========================================

# 格式
format = """
$username$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$line_break$character"""

# 目录配置 - Dracula cyan
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[\\$](end)"
style = "bold #8be9fd"

# Git 分支 - Purple
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #bd93f9"

# Git 状态
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #50fa7b"
conflicted = "⚔️"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "✨"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

# Node.js - Green
[nodejs]
format = "via [$symbol($version)]($style) "
style = "bold #50fa7b"
symbol = "⬢"

# Python - Yellow
[python]
format = "via [${symbol}(${version} \\($virtualenv\\))]($style) "
style = "yellow bold"

# Rust - Red
[rust]
format = "via [$symbol($version)]($style) "
style = "bold #ff5555"
symbol = "🦀"

# Golang - Cyan
[golang]
format = "via [$symbol($version)]($style) "
style = "cyan bold"
symbol = "🐹"

# 命令执行时间
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold #f1fa8c"

# 用户名
[username]
style_user = "bold #8be9fd"
style_root = "bold #ff5555"
format = "[$user]($style) "
show_always = false

# 终端字符
[character]
success_symbol = "[➜](bold #50fa7b)"
error_symbol = "[✗](bold #ff5555)"
vimcmd_symbol = "[❮](bold #50fa7b)"
